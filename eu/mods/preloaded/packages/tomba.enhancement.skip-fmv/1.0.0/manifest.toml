format_version = 5
id = "tomba.enhancement.skip-fmv"
version = "1.0.0"
name = "Skip FMVs"
author = "mstan"
description = "Automatically skips Tomba's full-motion videos, with an optional Any% setting to preserve the title opening, post-final-pig ending, and credits."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCES-01330"
disc_sha256 = "25aa80a9f7000fc68a4621e17c60fd1505df540dd6ed383baac305c37087bce2"


[[feature]]
id = "skip-fmv"
name = "Skip FMVs"
description = "End full-motion videos immediately through Tomba's original movie-completion logic. By default, skips every FMV, including the ending and credits."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "skip-fmv"
id = "preserve-any-percent"
label = "Preserve title and ending FMVs (Any%)"
description = "Play the title-screen opening, post-final-pig cutscene, and credits normally while skipping every other FMV. Leave off to skip all FMVs for All Events runs."
group = "Gameplay"
type = "boolean"
default = "false"

[[plugin]]
feature = "skip-fmv"
id = "tomba.skip-fmv"
