format_version = 5
id = "tombi.enhancement.hd-textures"
version = "1.0.0"
name = "HD Texture Packs"
author = "psxrecomp"
description = "Technical support for external texture mods, not a bundled HD upgrade. Requires a compatible external EU pack; no HD graphics are included. OpenGL displays matching PNG/JPEG/WebP replacements. See docs/HD_TEXTURE_PACKS.md for installation and creating packs."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCES-01330"

[[feature]]
id = "hd-textures"
name = "HD Texture Packs"
description = "OFF by default. Requires external replacement textures; no HD graphics are included. Select a compatible EU pack folder, check Installed, then enable. See docs/HD_TEXTURE_PACKS.md to create your own pack. Options apply on Play."
group = "Visual"
default_enabled = false

[[resource]]
feature = "hd-textures"
id = "pack"
label = "Texture pack folder"
description = "Select the downloaded pack folder. The installer finds a declared SCES-01330 pack inside it, validates replacement names and images, and remembers the folder. US-only and unidentified packs are rejected. For capture only, turn Load replacements off."
format = "directory"
texture_game_id = "SCES-01330"
file_description = "HD texture pack"
required = true

[[option]]
feature = "hd-textures"
id = "replacements"
label = "Load replacements"
description = "Display matching PNG/JPEG/WebP artwork from replacements in OpenGL. Missing or unsupported textures keep their original artwork. Turn this off when collecting originals."
type = "boolean"
default = "true"

[[option]]
feature = "hd-textures"
id = "dump"
label = "Dump textures"
description = "Collect original texture usage while playing. Exit the game to finish capture PNGs under dumps, then edit the files you need."
type = "boolean"
default = "false"

[[plugin]]
feature = "hd-textures"
id = "psx.hd-textures"
